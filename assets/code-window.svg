<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240">
  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 18px; }
    .k { fill: #2fbf8a; } .p { fill: #9fd9c2; } .s { fill: #e8c77a; } .w { fill: #ffffff; }

    /* 3 phrases x 4s = 12s loop; each phrase types, holds, erases in its own 4s slot */
    .phrase { animation: vis 12s linear infinite; }
    @keyframes vis { 0%, 33.2% { opacity: 1; } 33.34%, 100% { opacity: 0; } }
    .p0, .p0 .mv { animation-delay: 0s; }
    .p1, .p1 .mv { animation-delay: -8s; }
    .p2, .p2 .mv { animation-delay: -4s; }

    .mv { animation-duration: 12s; animation-iteration-count: infinite; }
    .p0 .mv { animation-name: m0; } .p1 .mv { animation-name: m1; } .p2 .mv { animation-name: m2; }
    @keyframes m0 { 0% { transform: translateX(0); animation-timing-function: steps(29, end); } 13.33%, 26.67% { transform: translateX(313.2px); animation-timing-function: steps(29, end); } 31.67%, 100% { transform: translateX(0); } }
    @keyframes m1 { 0% { transform: translateX(0); animation-timing-function: steps(30, end); } 13.33%, 26.67% { transform: translateX(324px); animation-timing-function: steps(30, end); } 31.67%, 100% { transform: translateX(0); } }
    @keyframes m2 { 0% { transform: translateX(0); animation-timing-function: steps(33, end); } 13.33%, 26.67% { transform: translateX(356.4px); animation-timing-function: steps(33, end); } 31.67%, 100% { transform: translateX(0); } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="560" height="240" rx="14" fill="#03140e"/>
  <rect x=".5" y=".5" width="559" height="239" rx="13.5" fill="none" stroke="#0e4e3a"/>
  <circle cx="26" cy="24" r="6" fill="#2fbf8a"/>
  <circle cx="46" cy="24" r="6" fill="#1f8a63"/>
  <circle cx="66" cy="24" r="6" fill="#135e46"/>
  <text class="mono" x="280" y="29" fill="#7aa594" font-size="14" style="font-size:14px" text-anchor="middle">developer.ts</text>
  <line x1="0" y1="46" x2="560" y2="46" stroke="#ffffff" stroke-opacity=".06"/>

  <g class="mono">
    <text x="28" y="84" textLength="140.4"><tspan class="k">const</tspan><tspan class="w"> dev = {</tspan></text>
    <text x="49.6" y="116" textLength="205.2"><tspan class="p">name</tspan><tspan class="w">: </tspan><tspan class="s">"Luis Marco"</tspan><tspan class="w">,</tspan></text>

    <text x="49.6" y="148" textLength="64.8"><tspan class="p">bio</tspan><tspan class="w">: </tspan><tspan class="s">"</tspan></text>
    <g class="phrase p0">
      <text class="s" x="114.4" y="148" textLength="313.2">Full Stack Software Developer</text>
      <g class="mv"><rect x="114.4" y="128" width="420" height="28" fill="#03140e"/><rect class="cursor" x="114.4" y="131" width="3" height="22" fill="#2fbf8a"/><text x="119.4" y="148" textLength="21.6"><tspan class="s">"</tspan><tspan class="w">,</tspan></text></g>
    </g>
    <g class="phrase p1">
      <text class="s" x="114.4" y="148" textLength="324">Clean code, scalable solutions</text>
      <g class="mv"><rect x="114.4" y="128" width="420" height="28" fill="#03140e"/><rect class="cursor" x="114.4" y="131" width="3" height="22" fill="#2fbf8a"/><text x="119.4" y="148" textLength="21.6"><tspan class="s">"</tspan><tspan class="w">,</tspan></text></g>
    </g>
    <g class="phrase p2">
      <text class="s" x="114.4" y="148" textLength="356.4">Always learning, always building.</text>
      <g class="mv"><rect x="114.4" y="128" width="420" height="28" fill="#03140e"/><rect class="cursor" x="114.4" y="131" width="3" height="22" fill="#2fbf8a"/><text x="119.4" y="148" textLength="21.6"><tspan class="s">"</tspan><tspan class="w">,</tspan></text></g>
    </g>

    <text x="49.6" y="180" textLength="248.4"><tspan class="p">motto</tspan><tspan class="w">: </tspan><tspan class="s">"keep building"</tspan><tspan class="w">,</tspan></text>
    <text class="w" x="28" y="212" textLength="21.6">};</text>
  </g>
</svg>
