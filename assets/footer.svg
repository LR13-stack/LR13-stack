<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05211a"/>
      <stop offset=".5" stop-color="#0e4e3a"/>
      <stop offset="1" stop-color="#05211a"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="150" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
    .wave { animation: drift 8s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translateX(-60px); } }
  </style>
  <g clip-path="url(#round)">
    <path class="wave" d="M0 48C200 8 400 88 600 48S1000 8 1260 48V150H0Z" fill="#0e4e3a" fill-opacity=".35"/>
    <path d="M0 64C220 28 420 100 620 64S1000 28 1200 64V150H0Z" fill="url(#bg)"/>
    <text class="sans" x="600" y="110" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">Building solutions, improving continuously.</text>
  </g>
</svg>
